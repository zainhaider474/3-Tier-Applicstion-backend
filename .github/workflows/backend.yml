name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Validate dependencies (CI)
      - name: Validate backend dependencies
        run: npm install

      # Configure AWS credentials via OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::141701955118:role/GitHub-OIDC-Role
          aws-region: us-east-1
          audience: GitHub-OIDC-Provider

      # Deploy backend on EC2 (CD)
      - name: Deploy Backend on EC2
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=i-0854b377583f20548" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend using PM2" \
            --parameters 'commands=[
              "cd /home/ubuntu/backend",
              "git fetch origin main",
              "git reset --hard origin/main",
              "npm install --omit=dev",
              "pm2 describe backend > /dev/null && pm2 restart backend || pm2 start index.js --name backend",
              "pm2 save"
            ]' \
            --region us-east-1