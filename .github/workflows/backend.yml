name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::141701955118:role/GitHub-OIDC-Role
          aws-region: us-east-1
          audience: GitHub-OIDC-Provider

      - name: Build and Deploy Backend on EC2
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Build and deploy backend using PM2" \
            --parameters 'commands=[
              "cd /home/ubuntu/backend",
              "git reset --hard",
              "git pull origin main",
              "npm install",
              "npm run build --if-present",
              "pm2 describe backend > /dev/null && pm2 restart backend || pm2 start index.js --name backend",
              "pm2 save"
            ]' \
            --region us-east-1